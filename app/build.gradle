plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mobile.rssreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mobile.rssreader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        // 伴生模块（备份与恢复）作为独立入口，同时保留主 App 数据层
        resValue 'string', 'app_name', '阅流 RSS'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        // AGP 8.x 起 BuildConfig 默认不生成，设置页要用 VERSION_NAME，这里显式开启
        buildConfig true
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/LICENSE*']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'

    // 生命周期：ViewModel + LiveData（Java 下替代协程的标准方案）
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'

    // 持久化
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // 后台任务
    implementation 'androidx.work:work-runtime:2.9.1'

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // 纯 JVM 单测里替代 android.util.Xml：kxml2 提供 org.xmlpull.v1 实现
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
